# ============================================================
# CI (Continuous Integration) workflow
# Har push aur pull request pe automatically chalta hai:
#   code check out -> Node install -> lint -> test -> build -> artifact save
# ============================================================
name: CI

# --- KAB chalay? (triggers) ---
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # GitHub UI se "Run workflow" button se manually bhi chala sakte hain

# --- KYA chalay? (jobs) ---
jobs:
  build-and-test:
    # Kis machine pe? GitHub free Linux VM deta hai
    runs-on: ubuntu-latest

    # Matrix: same job 3 Node versions pe parallel chalegi
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      # 1. Repo ka code VM pe download karo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js install karo (npm cache ke saath, taake agli dafa tez ho)
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # 3. Dependencies install (package-lock.json ke exact versions)
      - name: Install dependencies
        run: npm ci

      # 4. Code quality check
      - name: Lint
        run: npm run lint

      # 5. Tests — agar koi test fail hua to workflow yahin ruk jayega (red ❌)
      - name: Test
        run: npm test

      # 6. Build
      - name: Build
        run: npm run build

      # 7. Build output (dist/) ko save karo taake GitHub se download ho sake
      - name: Upload build artifact
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
