# ============================================================
# Android build automation
#   push / PR      → check + test + APK banao (Actions tab se download)
#   tag v* push    → upar wala sab + GitHub Release pe APK attach
# ============================================================
name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: # GitHub UI se "Run workflow" button

permissions:
  contents: write # Release banane ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Code download
      - uses: actions/checkout@v4

      # 2. Java (Android Gradle build ke liye zaroori)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Flutter — wahi version jo local pe hai, taake build same rahe
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # 4. Packages install
      - run: flutter pub get

      # 5. Code checks — koi bhi fail hua to build yahin ruk jayegi ❌
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

      # 6. APK build — version aur commit app ke andar likh dete hain
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_INFO="#${{ github.run_number }} · ${GITHUB_SHA::7}"

      # 7. APK ko save karo — Actions run page pe "Artifacts" mein milega
      - uses: actions/upload-artifact@v4
        with:
          name: shade-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # 8. Sirf tag push pe: GitHub Release banao aur APK attach karo
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk shade-${{ github.ref_name }}.apk
          gh release create "${{ github.ref_name }}" "shade-${{ github.ref_name }}.apk" \
            --title "Shade ${{ github.ref_name }}" --generate-notes
