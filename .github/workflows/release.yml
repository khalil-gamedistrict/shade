# ============================================================
# Release workflow (CD - Continuous Delivery)
# Jab aap version tag push karo (e.g. git tag v1.0.0 && git push --tags)
# to yeh build karke GitHub Release bana deta hai, zip file attach kar ke.
# ============================================================
name: Release

on:
  push:
    tags: ["v*"]

# Release banane ke liye repo pe likhne ki permission chahiye
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Zip build output
        run: cd dist && zip -r ../app-${{ github.ref_name }}.zip .

      # gh CLI GitHub ke runners pe pehle se installed hota hai
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub khud deta hai, kuch set nahi karna
        run: |
          gh release create "${{ github.ref_name }}" \
            "app-${{ github.ref_name }}.zip" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
